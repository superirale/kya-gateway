# Serves the dashboard and keeps the browser same-origin:
#   /kya/*      -> KYA API (the browser only uses public + consumer routes; merchant routes need a key it never has)
#   /merchant/* -> merchant demo agent (holds the merchant API key server-side)
server {
  listen 8080;
  server_tokens off;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'" always;

  location /kya/ {
    proxy_pass http://api:8080/;
    proxy_set_header X-Forwarded-For $remote_addr;
  }
  location /merchant/ {
    proxy_pass http://merchant:8081/;
    proxy_read_timeout 90s;
  }
  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
}
